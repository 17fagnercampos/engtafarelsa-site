# Painel de edição do site: https://app.pagescms.org (entre com a conta do GitHub)
media:
  input: fotos
  output: /fotos
content:
- name: blog
  label: Água Boa Dá Lucro (artigos)
  type: collection
  path: conteudo/blog
  format: yaml-frontmatter
  filename: '{primary}.md'
  view:
    fields:
    - titulo
    - data
    primary: titulo
    sort:
    - data
    - titulo
    default:
      sort: data
      order: desc
  fields:
  - name: titulo
    label: Título
    type: string
    required: true
  - name: categoria
    label: Categoria do portal Água Boa Dá Lucro
    type: select
    default: dicas-tecnicas
    options:
      values:
      - value: dicas-tecnicas
        label: Dicas técnicas
      - value: produtos
        label: Produtos Biotecnal
      - value: cases
        label: Cases
      - value: por-dentro-da-biotecnal
        label: Por dentro da Biotecnal
      - value: mercado
        label: Mercado e tendências
      - value: vida-no-campo
        label: Vida no campo
  - name: descricao
    label: Resumo para o Google (até ~160 letras)
    type: text
    required: true
  - name: data
    label: Data
    type: date
    options:
      format: yyyy-MM-dd
  - name: titulo_pagina
    label: Título curto no topo do artigo (opcional; o título completo continua no Google)
    type: string
  - name: etiqueta
    label: Etiqueta acima do título (opcional, ex. Case real · Rolante/RS)
    type: string
  - name: destaques
    label: Números em destaque abaixo do título (opcional, até 3)
    type: object
    list: true
    fields:
    - name: valor
      label: Número (ex. 5 → 0 mg/L)
      type: string
    - name: rotulo
      label: O que é (ex. nitrito)
      type: string
  - name: barra_pergunta
    label: Pergunta da barra de WhatsApp (opcional, ex. Nitrito ou amônia alta?)
    type: string
  - name: barra_texto
    label: Complemento da barra de WhatsApp (opcional, ex. Mande suas medições)
    type: string
  - name: atualizado
    label: Atualizado em (opcional, quando o artigo ganha uma parte nova)
    type: date
    options:
      format: yyyy-MM-dd
  - name: aviso_atualizacao
    label: Aviso de atualização no topo (opcional)
    type: string
  - name: rascunho
    label: Rascunho (não publicar ainda)
    type: boolean
    default: false
  - name: resposta
    label: Resposta rápida (2 a 4 frases, aparece no topo e é o que as IAs citam)
    type: text
  - name: foto
    label: Foto principal
    type: image
  - name: foto_legenda
    label: Legenda da foto
    type: string
  - name: episodio
    label: 'Episódio do YouTube (ex.: Episódio 3 da série Água Boa Dá Lucro)'
    type: string
  - name: produtos
    label: Produtos Biotecnal citados
    type: select
    options:
      multiple: true
      values:
      - value: oxitrat
        label: OXITRAT
      - value: bactrat-p
        label: BACTRAT P
      - value: nutrat-aqua-plus
        label: NUTRAT AQUA PLUS
      - value: bactrat-aquanitro
        label: BACTRAT AQUANITRO
      - value: bactrat-aquatech
        label: BACTRAT AQUATECH
      - value: bioflow-aqua
        label: BIOFLOW AQUA
      - value: bicarbonato-de-sodio
        label: BICARBONATO DE SÓDIO
  - name: perguntas
    label: Perguntas frequentes
    type: object
    list: true
    fields:
    - name: pergunta
      label: Pergunta
      type: string
    - name: resposta
      label: Resposta
      type: text
  - name: fontes
    label: Fontes (estudos e referências)
    type: object
    list: true
    fields:
    - name: texto
      label: Referência
      type: string
    - name: link
      label: Link (opcional)
      type: string
  - name: body
    label: Texto do artigo
    type: rich-text
    options:
      format: markdown
- name: fotos
  label: Fotos do site (veja o mapa em engtafarelsa.com.br/fotos-do-site)
  type: file
  path: conteudo/fotos.yml
  format: yaml
  fields:
  - name: inicio_tafarel
    label: "01 · Início · Quem assina o projeto"
    description: "Página inicial, seção Quem assina o projeto (sua foto em campo). Formato: Vertical (em pé)."
    type: object
    fields:
    - name: imagem
      label: Imagem
      type: image
    - name: descricao
      label: Descrição da foto (para Google e acessibilidade)
      type: string
  - name: sobre_retrato
    label: "02 · Sobre · Seu retrato"
    description: "Página Sobre, no topo, ao lado do seu nome. Formato: Vertical (em pé)."
    type: object
    fields:
    - name: imagem
      label: Imagem
      type: image
    - name: descricao
      label: Descrição da foto (para Google e acessibilidade)
      type: string
  - name: estufas
    label: "03 · Estufas · Foto do topo"
    description: "Página Estufas, no topo, ao lado do título. Formato: Horizontal (deitada)."
    type: object
    fields:
    - name: imagem
      label: Imagem
      type: image
    - name: descricao
      label: Descrição da foto (para Google e acessibilidade)
      type: string
  - name: tanques
    label: "04 · Tanques · Foto do topo"
    description: "Página Tanques de geomembrana, no topo. Formato: Horizontal (deitada)."
    type: object
    fields:
    - name: imagem
      label: Imagem
      type: image
    - name: descricao
      label: Descrição da foto (para Google e acessibilidade)
      type: string
  - name: piscicultura
    label: "05 · Piscicultura · Foto do topo"
    description: "Página Consultoria em piscicultura, no topo. Formato: Horizontal (deitada)."
    type: object
    fields:
    - name: imagem
      label: Imagem
      type: image
    - name: descricao
      label: Descrição da foto (para Google e acessibilidade)
      type: string
  - name: aquaponia
    label: "06 · Aquaponia · Foto do topo"
    description: "Página Aquaponia comercial, no topo. Formato: Horizontal (deitada)."
    type: object
    fields:
    - name: imagem
      label: Imagem
      type: image
    - name: descricao
      label: Descrição da foto (para Google e acessibilidade)
      type: string
  - name: hidroponia
    label: "07 · Hidroponia · Foto do topo"
    description: "Página Hidroponia, no topo. Formato: Horizontal (deitada)."
    type: object
    fields:
    - name: imagem
      label: Imagem
      type: image
    - name: descricao
      label: Descrição da foto (para Google e acessibilidade)
      type: string
  - name: hidroponia_galeria_1
    label: "08 · Hidroponia · Galeria 1"
    description: "Página Hidroponia, galeria, 1ª foto. Formato: Horizontal (deitada)."
    type: object
    fields:
    - name: imagem
      label: Imagem
      type: image
    - name: descricao
      label: Descrição da foto (para Google e acessibilidade)
      type: string
  - name: hidroponia_galeria_2
    label: "09 · Hidroponia · Galeria 2"
    description: "Página Hidroponia, galeria, 2ª foto. Formato: Horizontal (deitada)."
    type: object
    fields:
    - name: imagem
      label: Imagem
      type: image
    - name: descricao
      label: Descrição da foto (para Google e acessibilidade)
      type: string
  - name: hidroponia_galeria_3
    label: "10 · Hidroponia · Galeria 3"
    description: "Página Hidroponia, galeria, 3ª foto. Formato: Horizontal (deitada)."
    type: object
    fields:
    - name: imagem
      label: Imagem
      type: image
    - name: descricao
      label: Descrição da foto (para Google e acessibilidade)
      type: string
  - name: hidroponia_galeria_4
    label: "11 · Hidroponia · Galeria 4"
    description: "Página Hidroponia, galeria, 4ª foto. Formato: Horizontal (deitada)."
    type: object
    fields:
    - name: imagem
      label: Imagem
      type: image
    - name: descricao
      label: Descrição da foto (para Google e acessibilidade)
      type: string
  - name: traira
    label: "12 · Traíra e trairão · Foto do topo"
    description: "Página Traíra e trairão, no topo. Formato: Horizontal (deitada)."
    type: object
    fields:
    - name: imagem
      label: Imagem
      type: image
    - name: descricao
      label: Descrição da foto (para Google e acessibilidade)
      type: string
- name: sobre
  label: Página Sobre
  type: file
  path: conteudo/paginas/sobre.md
  format: yaml-frontmatter
  fields:
  - name: titulo
    label: Título
    type: string
  - name: subtitulo
    label: Subtítulo
    type: text
  - name: body
    label: Texto
    type: rich-text
    options:
      format: markdown
- name: config
  label: Configurações (WhatsApp, redes, Pixel)
  type: file
  path: conteudo/config.yml
  format: yaml
  fields:
  - name: whatsapp_tafarel
    label: WhatsApp do Tafarel (só números, com 55)
    type: string
  - name: whatsapp_tafarel_legivel
    label: WhatsApp do Tafarel (como aparece)
    type: string
  - name: whatsapp_vendas
    label: WhatsApp de vendas (só números, com 55)
    type: string
  - name: whatsapp_vendas_legivel
    label: WhatsApp de vendas (como aparece)
    type: string
  - name: grupo_whatsapp
    label: Link do grupo de WhatsApp Água Boa Dá Lucro (chat.whatsapp.com/...)
    type: string
  - name: youtube
    label: Canal do YouTube
    type: string
  - name: instagram
    label: Instagram
    type: string
  - name: facebook
    label: Página do Facebook
    type: string
  - name: meta_pixel_id
    label: ID do Pixel da Meta
    type: string
